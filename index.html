   Todo corre en el dispositivo. Sin dependencias.                                   */

function clamp(x,a,b){return x<a?a:(x>b?b:x);}
function db10(x){return 10*Math.log10(Math.max(x,1e-12));}
function mean(a){let s=0;for(let i=0;i<a.length;i++)s+=a[i];return a.length?s/a.length:0;}
function stdev(a){if(a.length<2)return 0;const m=mean(a);let s=0;for(let i=0;i<a.length;i++){const d=a[i]-m;s+=d*d;}return Math.sqrt(s/a.length);}
function median(a){if(!a.length)return 0;const b=Array.from(a).sort((x,y)=>x-y);const h=b.length>>1;return b.length%2?b[h]:(b[h-1]+b[h])/2;}

function r2(x){return Math.round(x*100)/100;}
function r3(x){return Math.round(x*1000)/1000;}

/* ── FFT radix-2 ── */
function makeFFT(n){
  const levels=Math.round(Math.log2(n));
  const cos=new Float64Array(n/2),sin=new Float64Array(n/2);
  for(let i=0;i<n/2;i++){cos[i]=Math.cos(2*Math.PI*i/n);sin[i]=Math.sin(2*Math.PI*i/n);}
  const rev=new Uint32Array(n);
  for(let i=0;i<n;i++){let r=0,x=i;for(let j=0;j<levels;j++){r=(r<<1)|(x&1);x>>=1;}rev[i]=r;}
  return function(re,im){
    for(let i=0;i<n;i++){const j=rev[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t;}}
    for(let size=2;size<=n;size<<=1){
      const half=size>>1,step=n/size;
      for(let i=0;i<n;i+=size){

          const tim=-re[l]*sin[k]+im[l]*cos[k];
          re[l]=re[j]-tre;im[l]=im[j]-tim;re[j]+=tre;im[j]+=tim;
        }
      }
    }
  };
}

              (A+1)-(A-1)*c+2*sA*al,2*((A-1)-(A+1)*c),(A+1)-(A-1)*c-2*sA*al);
  f0=38.13547087602444;Q=0.5003270373238773;w0=2*Math.PI*f0/sr;al=Math.sin(w0)/(2*Q);c=Math.cos(w0);
  const s2=bq((1+c)/2,-(1+c),(1+c)/2,1+al,-2*c,1-al);
  return[s1,s2];
}
function subblockPower(chs,sr){
  const sub=Math.max(1,Math.round(0.1*sr));
  const n=chs[0].length,nb=Math.floor(n/sub);
  const out=new Float64Array(nb);
  const [s1,s2]=kCoeffs(sr);
  for(const x of chs){
    let x1=0,x2=0,y1=0,y2=0,u1=0,u2=0,z1=0,z2=0;
    for(let b=0;b<nb;b++){
      let acc=0;const end=(b+1)*sub;
      for(let i=b*sub;i<end;i++){
        const xi=x[i];
        const y=s1.b0*xi+s1.b1*x1+s1.b2*x2-s1.a1*y1-s1.a2*y2;
        x2=x1;x1=xi;y2=y1;y1=y;
        const z=s2.b0*y+s2.b1*u1+s2.b2*u2-s2.a1*z1-s2.a2*z2;
        u2=u1;u1=y;z2=z1;z1=z;
        acc+=z*z;
      }
      out[b]+=acc/sub;
    }
  }
  return out;
}
function loudnessStats(sub){
  const n=sub.length,LU=b=>-0.691+10*Math.log10(Math.max(b,1e-12));
  if(n<4)return{lufs:-70,lra:0};
  const blocks=[];
  for(let i=0;i+4<=n;i++)blocks.push((sub[i]+sub[i+1]+sub[i+2]+sub[i+3])/4);
  const ag=blocks.filter(b=>LU(b)>-70);
  if(!ag.length)return{lufs:-70,lra:0};
  const rel=LU(mean(ag))-10;
  const rg=ag.filter(b=>LU(b)>rel);
  const lufs=LU(mean(rg.length?rg:ag));
  const st=[];
  for(let i=0;i+30<=n;i+=10){let s=0;for(let k=0;k<30;k++)s+=sub[i+k];st.push(s/30);}
  let lra=0;
  const stg=st.filter(b=>LU(b)>-70);
  if(stg.length>=3){
    const rel2=LU(mean(stg))-20;
    const v=stg.filter(b=>LU(b)>rel2).map(LU).sort((a,b)=>a-b);
    if(v.length>=2)lra=pct(v,0.95)-pct(v,0.10);
  }
  return{lufs,lra};
}

/* ── Utilidades musicales ── */
const KEY_NAMES=['Do','Do♯','Re','Mi♭','Mi','Fa','Fa♯','Sol','La♭','La','Si♭','Si'];
const KP_MAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88];
const KP_MIN=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
function pearson(a,b){
  const n=a.length,ma=mean(a),mb=mean(b);let sa=0,sb=0,sab=0;
  for(let i=0;i<n;i++){const x=a[i]-ma,y=b[i]-mb;sa+=x*x;sb+=y*y;sab+=x*y;}
  return(sa>0&&sb>0)?sab/Math.sqrt(sa*sb):0;
}
function detectKey(chroma){
  let best=-2,second=-2,bk=0,bm='mayor';
  for(let k=0;k<12;k++){
    const rot=new Array(12);
    for(let i=0;i<12;i++)rot[i]=chroma[(i+k)%12];
    const cM=pearson(rot,KP_MAJ),cm=pearson(rot,KP_MIN);
    for(const[c,m]of[[cM,'mayor'],[cm,'menor']]){
      if(c>best){second=best;best=c;bk=k;bm=m;}else if(c>second)second=c;
    }
  }
  return{name:KEY_NAMES[bk]+' '+bm,mode:bm,conf:r3(clamp(best,0,1)),margin:r3(Math.max(0,best-second))};
}

/* ── Tempo por autocorrelación del flujo espectral ── */
function acAt(o,lag){
  const li=Math.floor(lag),fr=lag-li,n=o.length;let s=0;
  const lim=n-li-1;if(lim<=0)return 0;
  for(let i=0;i<lim;i++)s+=o[i]*(o[i+li]*(1-fr)+o[i+li+1]*fr);
  return s/lim;
}
function bestTempo(o,fps,lo,hi,prior){
  let ac0=0;for(let i=0;i<o.length;i++)ac0+=o[i]*o[i];ac0/=Math.max(1,o.length);
  if(ac0<=1e-12)return{bpm:0,strength:0,cands:[]};
  const res=[];
  for(let b=lo;b<=hi;b+=0.5){
    const l=fps*60/b;
    if(l*3.2>=o.length)continue;
    let sc=acAt(o,l)+0.5*acAt(o,2*l)+0.25*acAt(o,3*l);
    sc/=ac0;
    if(prior){const z=Math.log2(b/prior)/0.9;sc*=Math.exp(-0.5*z*z);}
    res.push([b,sc,acAt(o,l)/ac0]);
  }
  if(!res.length)return{bpm:0,strength:0,cands:[]};
  const sorted=res.slice().sort((a,b)=>b[1]-a[1]);
  const top=sorted[0];
  // candidatos distintos (separados >8%)
  const cands=[];
  for(const r of sorted){if(cands.every(c=>Math.abs(r[0]-c)/c>0.08))cands.push(r[0]);if(cands.length>=3)break;}
  // refinar con parábola
  return{bpm:top[0],strength:clamp(top[2],0,1),cands};
}

/* ── Estructura por autosimilitud ── */
function analyzeStructure(feat,W,winDb,dur){
  // feat: Array de Float64Array(D) por ventana de 1 s
  const D=feat[0].length;
  const mu=new Float64Array(D),sd=new Float64Array(D);
  for(let d=0;d<D;d++){let s=0;for(let w=0;w<W;w++)s+=feat[w][d];mu[d]=s/W;}
  for(let d=0;d<D;d++){let s=0;for(let w=0;w<W;w++){const x=feat[w][d]-mu[d];s+=x*x;}sd[d]=Math.sqrt(s/W)||1;}
  const Z=[];
  for(let w=0;w<W;w++){
    const v=new Float64Array(D);let nn=0;
    for(let d=0;d<D;d++){v[d]=(feat[w][d]-mu[d])/sd[d];nn+=v[d]*v[d];}
    nn=Math.sqrt(nn)||1;for(let d=0;d<D;d++)v[d]/=nn;
    Z.push(v);
  }
  const S=new Float32Array(W*W);
  for(let i=0;i<W;i++)for(let j=i;j<W;j++){
    let s=0;const a=Z[i],b=Z[j];for(let d=0;d<D;d++)s+=a[d]*b[d];
    S[i*W+j]=s;S[j*W+i]=s;
  }
  const K=Math.max(4,Math.min(10,Math.floor(W/8)));
  const nov=new Float64Array(W);
  for(let i=K;i<=W-K;i++){
    let ll=0,rr=0,lr=0;
    for(let a=0;a<K;a++)for(let b=0;b<K;b++){
      ll+=S[(i-1-a)*W+(i-1-b)];rr+=S[(i+a)*W+(i+b)];lr+=S[(i-1-a)*W+(i+b)];
    }
    nov[i]=(ll+rr-2*lr)/(K*K);
  }
  const sm=new Float64Array(W);
  for(let i=0;i<W;i++){let s=0,c=0;for(let k=-1;k<=1;k++){const j=i+k;if(j>=0&&j<W){s+=nov[j];c++;}}sm[i]=s/c;}
  const nm=mean(sm),ns=stdev(sm),thr=Math.max(0.05,nm+0.55*ns);
  const cand=[];
  for(let i=K;i<=W-K;i++){
    let isMax=true;const h=Math.max(2,K>>1);
    for(let k=-h;k<=h;k++){const j=i+k;if(j>=0&&j<W&&sm[j]>sm[i]){isMax=false;break;}}
    if(isMax&&sm[i]>thr&&i>=6&&i<=W-6)cand.push([i,sm[i]]);
  }
  cand.sort((a,b)=>b[1]-a[1]);
  const minDist=Math.max(8,K);
  const bounds=[];
  for(const[i]of cand){if(bounds.every(b=>Math.abs(b-i)>=minDist))bounds.push(i);if(bounds.length>=10)break;}
  bounds.sort((a,b)=>a-b);
  const edges=[0,...bounds,W];
  const secs=[];
  for(let k=0;k<edges.length-1;k++){
    const s=edges[k],e=edges[k+1];
    const v=new Float64Array(D);for(let w=s;w<e;w++)for(let d=0;d<D;d++)v[d]+=Z[w][d];
    let nn=0;for(let d=0;d<D;d++)nn+=v[d]*v[d];nn=Math.sqrt(nn)||1;for(let d=0;d<D;d++)v[d]/=nn;
    let db=0;for(let w=s;w<e;w++)db+=winDb[w];db/=Math.max(1,e-s);
    secs.push({s,e,db,v});
  }
  const m=secs.length;
  // agrupación por similitud
  const par=secs.map((_,i)=>i);
  const find=x=>par[x]===x?x:(par[x]=find(par[x]));
  const SIM=0.62;
  const sim=(a,b)=>{let s=0;for(let d=0;d<D;d++)s+=secs[a].v[d]*secs[b].v[d];return s;};
  for(let i=0;i<m;i++)for(let j=i+1;j<m;j++)if(sim(i,j)>=SIM)par[find(i)]=find(j);
  const groups={};
  secs.forEach((_,i)=>{const g=find(i);(groups[g]=groups[g]||[]).push(i);});
  const labels=new Array(m).fill('');
  const repGroups=Object.values(groups).filter(g=>g.length>1);
  let chorusGroup=null;
  if(repGroups.length){
    let bestSc=-1e9;
    for(const g of repGroups){
      const md=mean(g.map(i=>secs[i].db));
      const sc=md+1.5*Math.log(g.length);
      if(sc>bestSc){bestSc=sc;chorusGroup=g;}
    }
    for(const g of repGroups)for(const i of g)labels[i]=(g===chorusGroup)?'Coro':'Verso';
  }
  for(let i=0;i<m;i++){
    if(labels[i])continue;
    const st=secs[i].s;
    if(i===0)labels[i]='Intro';
    else if(i===m-1)labels[i]='Cierre';
    else if(st>=0.55*dur&&chorusGroup)labels[i]='Puente';
    else if(chorusGroup&&labels[i+1]==='Coro')labels[i]='Pre-coro';
    else labels[i]='Transición';
  }
  const secOut=secs.map((x,i)=>({s:x.s,e:x.e,label:labels[i],db:r2(x.db)}));
  const repDur=repGroups.reduce((a,g)=>a+g.reduce((b,i)=>b+(secs[i].e-secs[i].s),0),0);
  const firstChorusIdx=labels.indexOf('Coro');
  const chor=secs.filter((_,i)=>labels[i]==='Coro').map(x=>x.db);
  const ver=secs.filter((_,i)=>labels[i]==='Verso').map(x=>x.db);
  return{
    sections:secOut,
    repeatRatio:r3(repDur/Math.max(1,W)),
    firstChorus:firstChorusIdx>=0?secs[firstChorusIdx].s:null,
    chorusCount:chor.length,
    chorusLift:(chor.length&&ver.length)?r2(mean(chor)-mean(ver)):null,
    energyStd:r2(stdev(secs.map(x=>x.db))),
    confidence:(repGroups.length&&m>=3)?'media':'baja'
  };
}

/* ═══════════════ ANÁLISIS PRINCIPAL ═══════════════ */
function analyze(L,R,sr,prog){
  prog=prog||function(){};
  const n=L.length,dur=n/sr;
  /* 1. Pico, recorte, estéreo */
  prog(0.02,'Midiendo niveles');
  let peak=0,clip=0,runs=0,run=0,sL=0,sR=0,sLR=0,sM=0,sS=0;
  const mono=new Float32Array(n);
  for(let i=0;i<n;i++){
    const l=L[i],r=R[i],al=l<0?-l:l,ar=r<0?-r:r;
    if(al>peak)peak=al;if(ar>peak)peak=ar;
    if(al>=0.999||ar>=0.999)clip++;
    if(al>=0.995||ar>=0.995){run++;}else{if(run>=3)runs++;run=0;}
    sL+=l*l;sR+=r*r;sLR+=l*r;
    const m=(l+r)*0.5,s=(l-r)*0.5;sM+=m*m;sS+=s*s;mono[i]=m;
  }
  if(run>=3)runs++;
  const corr=(sL>0&&sR>0)?sLR/Math.sqrt(sL*sR):1;
  const widthDb=db10(sS/Math.max(sM,1e-12));
  /* 2. Sonoridad */
  prog(0.08,'Calculando sonoridad');
  const sub=subblockPower([L,R],sr);
  const ld=loudnessStats(sub);
  const peakDb=20*Math.log10(Math.max(peak,1e-6));

  /* 3. Espectro por cuadros */
  const N=2048,half=N/2;
  let hop=1024;
  const maxF=14000;
  if((n-N)/hop>maxF)hop=Math.ceil((n-N)/maxF/256)*256;
  const F=Math.max(1,Math.floor((n-N)/hop)+1);
  const fps=sr/hop;
  const fft=makeFFT(N);
  const win=new Float64Array(N);
  for(let i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/(N-1));
  const binHz=sr/N;
  const edgesHz=[20,60,250,500,2000,4000,8000,16000,sr/2];
  const bandBin=edgesHz.map(f=>Math.min(half,Math.max(1,Math.round(f/binHz))));
  const NB=8;
  const bandE=new Float32Array(F*NB);
  const chroma=new Float32Array(F*12);
  const pcOf=new Int8Array(half+1).fill(-1);
  for(let k=1;k<=half;k++){const f=k*binHz;if(f>=130&&f<=4000){const midi=69+12*Math.log2(f/440);pcOf[k]=((Math.round(midi)%12)+12)%12;}}
  const kFlux=Math.min(half,Math.round(8000/binHz));
  const kV0=Math.round(300/binHz),kV1=Math.round(3400/binHz);
  const kFl0=Math.round(200/binHz),kFl1=Math.min(half,Math.round(8000/binHz));
  const kLoF=Math.round(200/binHz);
  const meanPow=new Float64Array(half+1);
  const cent=new Float32Array(F),flat=new Float32Array(F),flux=new Float32Array(F),fE=new Float32Array(F),voiceE=new Float32Array(F);
  const prevLog=new Float32Array(half+1);
  const re=new Float64Array(N),im=new Float64Array(N),mag=new Float32Array(half+1),pw=new Float64Array(half+1);
  const hfBand=new Float32Array(F);
  let silentFrames=0;
  for(let f=0;f<F;f++){
    const st=f*hop;
    for(let i=0;i<N;i++){re[i]=mono[st+i]*win[i];im[i]=0;}
    fft(re,im);
    let tot=0,cn=0,cd=0,fx=0,vE=0,lg=0,lgn=0,am=0;
    for(let k=0;k<=half;k++){
      const p=re[k]*re[k]+im[k]*im[k];
      pw[k]=p;meanPow[k]+=p;
      const mg=Math.sqrt(p)*2/N;mag[k]=mg;
      if(k>0){
        tot+=p;cn+=k*binHz*mg;cd+=mg;
        if(k>=kV0&&k<=kV1)vE+=p;
        if(k>=kFl0&&k<=kFl1){lg+=Math.log(p+1e-18);lgn++;am+=p;}
        if(pcOf[k]>=0)chroma[f*12+pcOf[k]]+=mg;
      }
      if(k<=kFlux){
        const lv=Math.log(1+1000*mg);
        const d=lv-prevLog[k];if(d>0)fx+=d;prevLog[k]=lv;
      }
    }
    for(let b=0;b<NB;b++){let s=0;for(let k=bandBin[b];k<bandBin[b+1];k++)s+=pw[k];bandE[f*NB+b]=s;}
    fE[f]=tot;cent[f]=cd>0?cn/cd:0;voiceE[f]=vE;
    flat[f]=lgn?Math.exp(lg/lgn)/Math.max(am/lgn,1e-18):0;
    flux[f]=f===0?0:fx;
    hfBand[f]=bandE[f*NB+6];
    if(tot<1e-6)silentFrames++;
    if((f&511)===0)prog(0.1+0.5*f/F,'Analizando espectro');
  }
  for(let k=0;k<=half;k++)meanPow[k]/=F;

  /* 4. Inclinación espectral y bandas 1/3 de octava */
  prog(0.62,'Balance de frecuencias');
  const bandsT=[];
  for(let c=100;c<=10000*1.01;c*=Math.pow(2,1/3)){
    const lo=c/Math.pow(2,1/6),hi=c*Math.pow(2,1/6);
    const k0=Math.max(1,Math.round(lo/binHz)),k1=Math.min(half,Math.max(k0+1,Math.round(hi/binHz)));
    let s=0;for(let k=k0;k<k1;k++)s+=meanPow[k];
    bandsT.push({c,db:db10(s/(k1-k0))});
  }
  // regresión dB vs log2(f)
  let sx=0,sy=0,sxx=0,sxy=0;const nb=bandsT.length;
  for(const b of bandsT){const x=Math.log2(b.c);sx+=x;sy+=b.db;sxx+=x*x;sxy+=x*b.db;}
  const slope=(nb*sxy-sx*sy)/(nb*sxx-sx*sx),icpt=(sy-slope*sx)/nb;
  const dev=(f0,f1)=>{
    const v=bandsT.filter(b=>b.c>=f0&&b.c<=f1).map(b=>b.db-(icpt+slope*Math.log2(b.c)));
    return v.length?mean(v):0;
  };
  const devMud=dev(200,500),devPresence=dev(2000,4000),devSib=dev(5000,9000),devLow=dev(100,160);
  // ancho de banda efectivo
  const refDb=db10(mean(Array.from(meanPow.slice(Math.round(1000/binHz),Math.round(4000/binHz)))));
  let bw=sr/2;
  const g=Math.max(2,Math.round(200/binHz));
  for(let k=half-g;k>Math.round(8000/binHz);k-=g){
    let s=0;for(let j=0;j<g;j++)s+=meanPow[k+j];
    if(db10(s/g)>refDb-70){bw=(k+g)*binHz;break;}
  }
  bw=Math.min(bw,sr/2);
  // reparto energético por banda
  const bandTot=new Float64Array(NB);
  for(let f=0;f<F;f++)for(let b=0;b<NB;b++)bandTot[b]+=bandE[f*NB+b];
  const bsum=bandTot.reduce((a,b)=>a+b,0)||1;
  const bandNames=['sub','graves','medios bajos','medios','medios altos','presencia','aire','ultra'];
  const bands={};bandNames.forEach((nm,i)=>bands[nm]=r2(100*bandTot[i]/bsum));
  // brillo y textura
  const centSm=[];const fpsI=Math.max(1,Math.round(fps));
  for(let i=0;i+fpsI<=F;i+=fpsI)centSm.push(mean(cent.subarray(i,i+fpsI)));
  const centMean=mean(centSm),centCv=centMean>0?stdev(centSm)/centMean:0;
  // destello de agudos (variabilidad cuadro a cuadro de la banda 8-16 kHz)
  let shimmer=0,shn=0;
  for(let f=1;f<F;f++){const a=hfBand[f],b=hfBand[f-1];if(a>1e-9&&b>1e-9){shimmer+=Math.abs(db10(a)-db10(b));shn++;}}
  shimmer=shn?shimmer/shn:0;

  /* 5. Tempo */
  prog(0.68,'Detectando tempo y ritmo');
  const o=new Float32Array(F);
  const lw=Math.max(2,Math.round(fps*0.3));
  for(let f=0;f<F;f++){
    let s=0,c=0;for(let k=-lw;k<=lw;k++){const j=f+k;if(j>=0&&j<F){s+=flux[j];c++;}}
    const v=flux[f]-s/c;o[f]=v>0?v:0;
  }
  const tp=bestTempo(o,fps,55,210,112);
  let tempoSd=0;
  if(tp.bpm>0){
    const wl=Math.round(fps*20),bs=[];
    for(let st=0;st+wl<=F;st+=wl){
      const t=bestTempo(o.subarray(st,st+wl),fps,tp.bpm*0.9,tp.bpm*1.1,0);
      if(t.bpm>0)bs.push(t.bpm);
    }
    tempoSd=bs.length>=2?stdev(bs):0;
  }
  // tasa de ataques
  let onsets=0;const oth=mean(o)+1.0*stdev(o);
  for(let f=1;f<F-1;f++)if(o[f]>oth&&o[f]>=o[f-1]&&o[f]>o[f+1])onsets++;
  const onsetRate=onsets/Math.max(1,dur);

  /* 6. Tonalidad y armonía */
  prog(0.78,'Detectando tonalidad');
  const chromaMean=new Float64Array(12);
  for(let f=0;f<F;f++){const w=Math.sqrt(fE[f]);for(let c=0;c<12;c++)chromaMean[c]+=chroma[f*12+c]*(w>0?1:0);}
  const key=detectKey(Array.from(chromaMean));
  const cs=chromaMean.reduce((a,b)=>a+b,0)||1;
  let ent=0;for(let c=0;c<12;c++){const p=chromaMean[c]/cs;if(p>0)ent-=p*Math.log2(p);}
  // ventanas de 1 s
  const W=Math.floor(dur);
  const winDb=new Float64Array(W),winFeat=[];
  const cw=[];
  for(let w=0;w<W;w++){
    const a=Math.min(F-1,Math.floor(w*fps)),b=Math.min(F,Math.max(a+1,Math.floor((w+1)*fps)));
    let e=0;const ch=new Float64Array(12),bd=new Float64Array(NB);
    for(let f=a;f<b;f++){e+=fE[f];for(let c=0;c<12;c++)ch[c]+=chroma[f*12+c];for(let q=0;q<NB;q++)bd[q]+=bandE[f*NB+q];}
    const cnt=b-a;
    winDb[w]=db10(e/cnt/(N*N*0.375)*1);// referencia relativa
    const cn=ch.reduce((x,y)=>x+y,0)||1;
    const v=new Float64Array(12+NB+1);
    for(let c=0;c<12;c++)v[c]=ch[c]/cn;
    for(let q=0;q<NB;q++)v[12+q]=db10(bd[q]/cnt);
    v[12+NB]=winDb[w];
    winFeat.push(v);cw.push(ch.map(x=>x/cn));
  }
  // actividad armónica: distancia coseno entre ventanas de 2 s consecutivas
  let hr=0,hn=0;
  for(let w=2;w+2<=W;w+=2){
    const a=new Float64Array(12),b=new Float64Array(12);
    for(let c=0;c<12;c++){a[c]=(cw[w-2][c]+cw[w-1][c])/2;b[c]=(cw[w][c]+cw[w+1<W?w+1:w][c])/2;}
    let d=0,na=0,nb2=0;for(let c=0;c<12;c++){d+=a[c]*b[c];na+=a[c]*a[c];nb2+=b[c]*b[c];}

  /* 7. Estructura */

  if(W>=30){
    // normalizar nivel de ventana a dBFS aproximado usando la sonoridad global como ancla
    const wm=mean(winDb);const off=ld.lufs-wm;
    const wdb=Array.from(winDb,x=>x+off);
    structure=analyzeStructure(winFeat,W,wdb,dur);
  }
  // cierre: caída de nivel final
  let endDrop=0;
  if(W>=30){
    const last=Array.from(winDb.subarray(W-6,W)),body=Array.from(winDb.subarray(Math.max(0,W-36),W-8));
    endDrop=mean(last)-mean(body);
  }

  const PTS=Math.min(240,Math.max(40,Math.floor(dur*2)));

  for(let p=0;p<PTS;p++){
    const a=Math.floor(p*F/PTS),b=Math.max(a+1,Math.floor((p+1)*F/PTS));
    env.push(db10(mean(fE.subarray(a,b))));centV.push(mean(cent.subarray(a,b)));
  }
  const emax=Math.max(...env);
  const envN=env.map(x=>r2(clamp((x-(emax-42))/42,0,1)));
  const cmin=Math.min(...centV),cmax=Math.max(...centV);
  const centN=centV.map(x=>r2(cmax>cmin?(x-cmin)/(cmax-cmin):0.5));

    const L15=15;let bs=-1e9,bi=0;
    const isCh=new Uint8Array(W);
    for(const s of structure.sections)if(s.label==='Coro')for(let w=s.s;w<s.e;w++)isCh[w]=1;
    const sc=new Float64Array(W);for(let w=0;w<W;w++)sc[w]=winDb[w]+(isCh[w]?3:0);
    for(let i=0;i+L15<=W;i++){let s=0;for(let k=0;k<L15;k++)s+=sc[i+k];if(s>bs){bs=s;bi=i;}}
    bestClip={start:bi,len:L15};
  }
  prog(0.97,'Resumiendo');
  return{
    v:1,dur:r2(dur),sr,
    peakDb:r2(peakDb),clipRatio:r3(clip/n*1000)/1000,clipRuns:runs,
    lufs:r2(ld.lufs),lra:r2(ld.lra),plr:r2(peakDb-ld.lufs),
    corr:r3(corr),widthDb:r2(widthDb),
    tilt:r2(slope),devMud:r2(devMud),devPresence:r2(devPresence),devSib:r2(devSib),devLow:r2(devLow),
    bandwidthHz:Math.round(bw),bands,
    centroid:{mean:Math.round(centMean),cv:r3(centCv)},
    flatness:r3(mean(flat)),fluxMean:r3(mean(flux)),shimmer:r2(shimmer),
    tempo:{bpm:r2(tp.bpm),strength:r3(tp.strength),stability:r2(tempoSd),alt:tp.cands.map(r2),onsetRate:r2(onsetRate)},
    key,chromaEntropy:r3(ent),harmonicRate:r3(harmonicRate),
    structure,endDrop:r2(endDrop),
    env:envN,cent:centN,bestClip,
    silentRatio:r3(silentFrames/F)

}

    `sonoridad ${f.lufs.toFixed(1)} LUFS (objetivo ${G.lufs[0]} a ${G.lufs[1]})`,

    `balance ${f.tilt<G.tilt[0]?'con exceso de graves':f.tilt>G.tilt[1]?'brillante o delgado':'equilibrado'}, ancho de banda ≈ ${(f.bandwidthHz/1000).toFixed(1)} kHz`]};
  if(f.lufs<G.lufs[0]-2)tip(.35,`Suena bajo (${f.lufs.toFixed(1)} LUFS). Un masterizado que lo suba hacia ${G.lufs[0]} LUFS ayuda frente a otras pistas.`);
  if(f.lufs>G.lufs[1]+2)tip(.35,`Está muy fuerte (${f.lufs.toFixed(1)} LUFS): las plataformas lo bajarán y se pierde dinámica.`);
  if(f.clipRuns>5||f.peakDb>.5)tip(.7,`Hay ${f.clipRuns} tramos con recorte y pico de ${f.peakDb.toFixed(1)} dBFS. Baja la ganancia o usa un limitador antes de entregar.`);
  if(f.tilt<G.tilt[0]-.5)tip(.4,'Exceso de graves frente al resto del espectro. Recorta sub-graves o regenera con "clean low end".');
  if(f.tilt>G.tilt[1]+.5)tip(.35,'Espectro brillante o con poco cuerpo. Refuerza graves y medios bajos.');
  if(f.bandwidthHz<15000)tip(.3,`Ancho de banda limitado (≈ ${(f.bandwidthHz/1000).toFixed(1)} kHz): típico de MP3 comprimido. Descarga WAV si tu plan lo permite.`);
  if(f.widthDb<-20||f.corr>.98)tip(.25,'Imagen casi mono. Una mezcla más ancha en medios altos y agudos le daría amplitud.');
  if(f.shimmer>8)tip(.3,'Variación alta e irregular en agudos (8–16 kHz): posible artefacto típico de generación con IA.');

  const dev=fit(zm,[1,2],.8),bt=batch.get(song.id+ab);

  D.id={s:hasI?.5*idAuto+.5*man.id:idAuto,conf:hasI?'media':'baja',why:[
    `movimiento tímbrico ${Math.round(dyn)}/100 y riqueza armónica ${Math.round(rich)}/100`,
    `se aparta del perfil típico del género de forma ${zm<.7?'mínima':zm<=1.8?'moderada':'marcada'}`,
    batch.size>=4?`distintividad frente al resto de tu lote: ${Math.round(bt)}/100`:'con 4 o más pistas se compara contra tu propio lote',
    hasI?`tu valoración de escucha: ${man.id}/100 (peso 50%)`:'el factor diferencial real requiere tu escucha: añádelo abajo']};
  /* Ajuste al género */
  const cFit=fit(f.centroid.mean,G.cent,1500);
  D.gen={s:.25*tb+.15*loud+.15*eDur+.15*cFit+.15*tilt+.15*eFc,conf:song.genre?'media':'baja',why:[
    song.genre?`frente al perfil de ${song.genre}`:'sin género indicado: se usa un perfil general (elige el género para afinar)',
    `tempo ${Math.round(tb)}/100, sonoridad ${Math.round(loud)}/100, brillo ${Math.round(cFit)}/100`]};
  /* Plataformas */
  const str=.3*fit(fc==null?60:fc,[0,35],30)+.2*fit(f.dur,[120,220],70)+.25*fit(f.lufs,[-14,-8],6)+.25*clip;
  const soc=.3*D.hook.s+.25*beat+.25*fit(bpm,[85,135],30)+.2*(st.chorusLift==null?50:fit(st.chorusLift,[2,7],4));
  const rad=.3*fit(f.dur,[150,225],40)+.25*fit(f.lufs,[-14,-8],6)+.2*(D.voz.s==null?60:D.voz.s)+.25*D.prod.s;
  const syn=.3*(ns>=4?100:60)+.25*D.prod.s+.2*ton+.25*(ns?fit(st.energyStd,[2,6],4):50);
  D.plat={s:.3*str+.25*soc+.15*rad+.3*syn,conf:'media',why:[`Streaming ${Math.round(str)} · Redes ${Math.round(soc)} · Radio ${Math.round(rad)} · Sincronización ${Math.round(syn)}`,
    `mejor fragmento de 15 s para redes: desde ${fmtT(f.bestClip.start)}`]};
  const plat={Streaming:str,Redes:soc,Radio:rad,Sincronización:syn};
  DIMS.forEach(d=>{if(D[d.k].s!=null)D[d.k].s=Math.round(cl(D[d.k].s))});
  /* Compuestos */
  const W={est:.15,hook:.2,arm:.1,voz:.1,prod:.15,gen:.15,plat:.15};
  let a=0,w=0;for(const k in W)if(D[k].s!=null){a+=W[k]*D[k].s;w+=W[k]}
  const comm=a/w;
  const uni0=.6*D.id.s+.15*D.hook.s+.1*D.arm.s+.15*D.prod.s,uni=D.prod.s<45?uni0*.85:uni0;
  const ev={dims:D,comm:Math.round(comm),uni:Math.round(uni),plat:Object.fromEntries(Object.entries(plat).map(([k,v])=>[k,Math.round(v)])),tips,f,tbpm};
  ev.v=verdict(ev);ev.aud=audFit(ev,song);
  return ev;
}
function verdict(ev){
  const t=S.settings.thr,d=ev.dims;
  const com=ev.comm>=t.com&&d.prod.s>=55&&d.hook.s>=50&&d.est.s>=50;
  const hit=com&&ev.comm>=t.hit&&d.hook.s>=75&&d.plat.s>=72&&d.prod.s>=70;
  const uni=ev.uni>=t.uni&&d.id.s>=72&&d.prod.s>=60&&d.hook.s>=45&&d.est.s>=50;
  let label,cls;
  if(hit&&uni){label='Hit comercial + Unicornio sónico';cls='hit'}
  else if(hit){label='Hit comercial';cls='hit'}
  else if(com&&uni){label='Comercial + Unicornio sónico';cls='uni'}
  else if(uni){label='Unicornio sónico (poco comercial)';cls='uni'}
  else if(com){label='Comercial, pero no es Hit';cls='com'}
  else{label='Aún no alcanza el umbral comercial';cls='dev'}
  return{hit,com,uni,label,cls};
}
function audFit(ev,song){
  const d=ev.dims,s=k=>d[k].s,p=ev.plat,vz=d.voz.s==null?55:d.voz.s;
  const F={general:.45*ev.comm+.3*s('hook')+.25*s('plat'),bandas:.35*ev.comm+.2*s('est')+.2*s('hook')+.25*vz,
    empresas:.4*ev.comm+.3*s('prod')+.3*p.Sincronización,indie:.6*ev.uni+.25*s('id')+.15*s('prod'),
    creadores:.4*p.Redes+.3*s('hook')+.3*s('prod'),sync:.5*p.Sincronización+.3*s('prod')+.2*s('est'),
    pymes:.4*s('prod')+.3*s('gen')+.3*ev.comm,audiovisual:.45*p.Sincronización+.25*s('id')+.3*s('prod')};
  const all=AUD.map(a=>({k:a.k,n:a.n,v:Math.round(cl(F[a.k]))})).sort((x,y)=>y.v-x.v);
  const sel=all.filter(a=>song.aud.includes(a.k));
  return{all,sel,avg:sel.length?Math.round(mean(sel.map(x=>x.v))):null};
}
/* Valoración MXN por comprador */
function licFor(seg,s,v){
  const ks=Object.keys(P.t[seg]);let lic;
  if(seg==='personas')lic=s>=80?'exclusiva':s>=68?'premium':s>=52?'comercial':'personal';
  else lic=(v.hit||v.uni)&&s>=(seg==='empresas'?68:70)?'exclusiva':s>=55?'premium':'comercial';
  return ks.includes(lic)?lic:ks[ks.length-1];
}
function valuate(ev,song){
  const d=ev.dims,p=ev.plat,vz=d.voz.s==null?55:d.voz.s,out={};
  const sc={empresas:.4*ev.comm+.3*p.Sincronización+.15*d.prod.s+.15*ev.uni,
    personas:.45*d.prod.s+.25*d.gen.s+.3*p.Redes,
    bandas:.35*ev.comm+.25*d.hook.s+.2*d.est.s+.2*vz};
  for(const seg in SEG){
    const s=Math.round(cl(sc[seg])),lic=licFor(seg,s,ev.v),[lo,hi]=P.t[seg][lic],t=cl((s-40)/50,0,1),r=x=>Math.round(x/50)*50;
    const star=song.aud.some(k=>(AUD.find(a=>a.k===k)||{}).seg===seg);
    out[seg]={s,lic,min:r(lo+(hi-lo)*Math.max(0,t-.25)),max:r(lo+(hi-lo)*Math.min(1,t+.25)),star,
      why:`Licencia ${lic} sugerida: puntaje de encaje ${s}/100 con «${ev.v.label}». Posición ${Math.round(t*100)}% dentro del rango de tu tabla (${mxn(lo)}–${mxn(hi)}).`};
  }
  return out;
}
/* Veredicto del par */
function pairInfo(i){
  const song=S.songs[i],batch=batchRank(),ev={};
  ['A','B'].forEach(ab=>{if(song.feat[ab])ev[ab]=evaluate(song.feat[ab],song,ab,batch)});
  const mode=S.settings.mode,ov=e=>mode==='com'?e.comm:mode==='uni'?e.uni:.6*e.comm+.4*e.uni;
  const both=ev.A&&ev.B;let win=ev.A?'A':ev.B?'B':null,margin=0;
  if(both){const a=ov(ev.A),b=ov(ev.B);win=a>=b?'A':'B';margin=Math.abs(a-b)}
  let roleC=null;if(both)roleC=(ev.A.comm-ev.A.uni)>=(ev.B.comm-ev.B.uni)?'A':'B';
  const lines=[];
  if(both){
    const a=ev.A.v,b=ev.B.v;
    if(a.hit&&b.hit)lines.push('<b>Hit comercial:</b> las dos versiones (A y B) lo son.');
    else if(a.hit||b.hit){const h=a.hit?'A':'B',o=a.hit?'B':'A',vo=a.hit?b:a;
      lines.push(`<b>Hit comercial:</b> solo la versión ${h}. La ${o} ${vo.com?'es comercial pero no alcanza nivel Hit':'aún no alcanza el umbral comercial'}.`)}
    else if(a.com&&b.com)lines.push('<b>Hit comercial:</b> ninguna lo es. Las dos son comerciales, pero no llegan a Hit.');
    else if(a.com||b.com){const c=a.com?'A':'B',o=a.com?'B':'A';lines.push(`<b>Hit comercial:</b> ninguna. La ${c} es comercial (no Hit); la ${o} aún no alcanza el umbral comercial.`)}
    else lines.push('<b>Hit comercial:</b> ninguna versión es Hit ni alcanza el umbral comercial todavía.');
    if(a.uni&&b.uni)lines.push('<b>Unicornio sónico:</b> las dos versiones tienen perfil de unicornio.');
    else if(a.uni||b.uni){const u=a.uni?'A':'B',o=a.uni?'B':'A';lines.push(`<b>Unicornio sónico:</b> solo la versión ${u}. La ${o} no lo es.`)}
    else lines.push('<b>Unicornio sónico:</b> ninguna versión alcanza el umbral. No es unicornio.');
    if(margin<3)lines.push(`<b>Ganadora:</b> empate técnico (diferencia de ${margin.toFixed(1)} pts). Decide con tu escucha; hoy el puntaje favorece a la ${win}.`);
    else{
      const dd=DIMS.filter(d=>ev.A.dims[d.k].s!=null).map(d=>({n:d.n,x:ev[win].dims[d.k].s-ev[win==='A'?'B':'A'].dims[d.k].s})).sort((p,q)=>q.x-p.x).slice(0,2).filter(x=>x.x>0);
      lines.push(`<b>Ganadora:</b> versión ${win}, por ${margin.toFixed(1)} pts${dd.length?` (gana en ${dd.map(x=>x.n.toLowerCase()+' +'+x.x).join(' y ')})`:''}.`);
    }
    lines.push(`<b>Perfil dentro del par:</b> la ${roleC} es la más comercial y la ${roleC==='A'?'B':'A'} la más cercana a unicornio.`);
  }else if(win){
    lines.push(`Solo se analizó la versión ${win}: ${ev[win].v.label.toLowerCase()}. Carga la otra versión para compararlas.`);
  }
  return{song,ev,win,margin,roleC,lines,both,mode};
}
/* Estructura de datos para tablas globales */
function allRows(){
  const rows=[];
  S.songs.forEach((s,i)=>{if(!s.feat.A&&!s.feat.B)return;const pi=pairInfo(i);
    ['A','B'].forEach(ab=>{const e=pi.ev[ab];if(!e)return;
      rows.push({i,ab,title:s.title||`Canción ${i+1}`,file:(s.files[ab]||{}).name||'(sin nombre)',ev:e,win:pi.win===ab,role:pi.both?(pi.roleC===ab?'Comercial':'Unicornio'):'',val:valuate(e,s)})})});
  return rows;
}

/* ═══════════════ ARCHIVOS: validación y carga ═══════════════ */
async function sniffMp3(file){
  try{
    const b=new Uint8Array(await file.slice(0,16384).arrayBuffer());let o=0;
    if(b[0]===0x49&&b[1]===0x44&&b[2]===0x33){const sz=((b[6]&127)<<21)|((b[7]&127)<<14)|((b[8]&127)<<7)|(b[9]&127);o=10+sz}
    let a=b.subarray(Math.min(o,b.length));
    if(o>=b.length)a=new Uint8Array(await file.slice(o,o+8192).arrayBuffer());
    for(let i=0;i+1<a.length&&i<8192;i++)if(a[i]===0xFF&&(a[i+1]&0xE0)===0xE0&&((a[i+1]>>1)&3)!==0&&((a[i+1]>>3)&3)!==1)return true;
    return false;
  }catch(_){return false}
}
async function hashFile(file){
  try{const d=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(_){return'f'+file.size+'-'+file.lastModified+'-'+file.name}
}
function probeDur(file){
  return new Promise(res=>{const u=URL.createObjectURL(file),a=new Audio();let done=false;
    const fin=v=>{if(done)return;done=true;URL.revokeObjectURL(u);res(v)};
    a.preload='metadata';a.onloadedmetadata=()=>fin(isFinite(a.duration)?a.duration:null);a.onerror=()=>fin(null);setTimeout(()=>fin(null),8000);a.src=u});
}
const cleanTitle=n=>n.replace(/\.mp3$/i,'').replace(/[_]+/g,' ').replace(/\s*[\(\[]?\s*(v|ver|version|versión)?\s*\d{1,2}\s*[\)\]]?\s*$/i,'').replace(/\s+/g,' ').trim().slice(0,60);
async function addFile(i,ab,file){
  const key=i+ab,song=S.songs[i];ui.msg[key]=null;
  const err=t=>{ui.msg[key]={k:'err',t};render(true);return false};
  if(!(/\.mp3$/i.test(file.name)||file.type==='audio/mpeg'))return err('No es un MP3. Solo se aceptan archivos .mp3.');
  if(file.size<100e3)return err('Archivo demasiado pequeño (menos de 100 KB).');
  if(file.size>40e6)return err('Supera 40 MB. Exporta una versión más ligera.');
  if(!await sniffMp3(file))return err('El contenido no parece un MP3 válido (dañado o renombrado).');
  const hash=await hashFile(file);
  for(let j=0;j<NS;j++)for(const b of['A','B']){
    if(j===i&&b===ab)continue;const x=S.songs[j].files[b];
    if(x&&x.hash===hash)return err(j===i?'La versión A y la B son el mismo archivo. Cada versión debe ser distinta.':`Archivo duplicado: ya está en Canción ${j+1}, versión ${b}.`);
  }
  const dur=await probeDur(file);
  if(dur!=null&&(dur<20||dur>600))return err(`Duración fuera de rango (${fmtT(dur)}). Se aceptan de 0:20 a 10:00.`);
  song.files[ab]={name:file.name,size:file.size,hash,dur:dur?Math.round(dur*10)/10:null};
  song.feat[ab]=null;song.manual[ab]={voz:null,id:null};
  mem.set(key,file);
  if(!await idb.put(key,file))ui.msg[key]={k:'wmsg',t:'No se pudo guardar el audio en el dispositivo; solo estará disponible en esta sesión.'};
  if(!song.title)song.title=cleanTitle(file.name);
  save();render(true);
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  return true;
}
async function bulkAdd(files){
  const mp3=[...files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  const norm=n=>n.replace(/\.mp3$/i,'').toLowerCase().replace(/[\s_\-]*[\(\[]?\s*(v|ver|version|versión)?[\s_\-]*(\d{1,2}|[ab])\s*[\)\]]?$/i,'').trim();
  const groups=new Map();mp3.forEach(f=>{const k=norm(f.name);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(f)});
  const pairs=[],singles=[];
  groups.forEach(arr=>{while(arr.length>=2)pairs.push(arr.splice(0,2));singles.push(...arr)});
  for(let k=0;k+1<singles.length;k+=2)pairs.push([singles[k],singles[k+1]]);
  if(singles.length%2)pairs.push([singles[singles.length-1]]);
  let n=0;
  for(const p of pairs){
    const idx=S.songs.findIndex(s=>!s.files.A&&!s.files.B);
    if(idx<0){toast('Solo caben 5 canciones. Quita alguna para agregar más.','err');break}
    if(await addFile(idx,'A',p[0]))n++;
    if(p[1]&&await addFile(idx,'B',p[1]))n++;
  }
  if(n)toast(`${n} archivo${n>1?'s':''} agregado${n>1?'s':''} y emparejado${n>1?'s':''}. Revisa cada par.`);
}

/* ═══════════════ ANÁLISIS ═══════════════ */
const WORKER_TAIL=`
self.onmessage=function(e){var d=e.data;try{var feat=analyze(d.L,d.mono?d.L:d.R,d.sr,function(p,m){self.postMessage({p:p,m:m})});self.postMessage({done:true,feat:feat});}catch(err){self.postMessage({error:String(err&&err.message||err)});}};`;
async function decodeBlob(blob){
  const Ctx=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const ctx=new Ctx(2,44100,44100);
  return await ctx.decodeAudioData(await blob.arrayBuffer());
}
function runDsp(L,R,sr,mono,onP){
  return new Promise((res,rej)=>{
    let w;const src=$('#dsp-src').textContent;
    try{w=new Worker(URL.createObjectURL(new Blob([src+WORKER_TAIL],{type:'text/javascript'})))}
    catch(_){try{const an=new Function(src+';return analyze;')();res(an(L,mono?L:R,sr,onP))}catch(e){rej(e)}return}
    ui.cancel=()=>{try{w.terminate()}catch(_){}rej(new Error('cancelado'))};
    w.onmessage=ev=>{const d=ev.data;
      if(d.p!=null)onP(d.p,d.m);
      else if(d.done){w.terminate();res(d.feat)}
      else if(d.error){w.terminate();rej(new Error(d.error))}};
    w.onerror=ev=>{w.terminate();rej(new Error(ev.message||'Error del motor de análisis'))};
    w.postMessage({L,R,sr,mono},mono?[L.buffer]:[L.buffer,R.buffer]);
  });
}
function drawJob(){
  let o=$('#overlay');const j=ui.job;
  if(!j){if(o)o.remove();return}

  const done=j.items.filter(x=>x.state==='ok'||x.state==='err').length;
  o.innerHTML=`<div class="sheet"><h3>Analizando ${done}/${j.items.length}</h3><p class="small muted">Mantén la app abierta. Todo ocurre en tu dispositivo.</p>`+
    j.items.map(it=>{const s=S.songs[it.i];return `<div class="job"><span>${esc(s.title||'Canción '+(it.i+1))} · ${it.ab}</span><span class="small muted">${it.state==='ok'?'Listo':it.state==='err'?'Error':it.state==='run'?esc(it.msg||'Procesando'):'En espera'}</span><div class="bar ${it.state==='err'?'lo':''}"><i style="width:${Math.round((it.state==='ok'?1:it.p||0)*100)}%"></i></div>${it.state==='err'?`<div class="err" style="grid-column:1/-1">${esc(it.msg)}</div>`:''}</div>`}).join('')+
    `<div class="row" style="margin-top:12px"><button class="btn danger ghost" data-act="cancel">${j.fin?'Cerrar':'Cancelar'}</button></div></div>`;
}
async function analyzeAll(){
  if(ui.job)return;
  const items=[];S.songs.forEach((s,i)=>['A','B'].forEach(ab=>{if(s.files[ab]&&!s.feat[ab])items.push({i,ab,state:'wait',p:0,msg:''})}));
  if(!items.length){location.hash='#/resultados';return}
  ui.job={items,cancel:false,fin:false};drawJob();
  let wl=null;try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(_){}
  for(const it of items){
    if(ui.job.cancel)break;
    it.state='run';it.msg='Leyendo archivo';drawJob();
    try{
      const blob=await getBlob(it.i,it.ab);
      if(!blob)throw new Error('El audio ya no está en el dispositivo. Vuelve a cargarlo.');
      it.msg='Decodificando audio';drawJob();
      const buf=await decodeBlob(blob);
      if(buf.duration<20||buf.duration>600)throw new Error('Duración fuera de 0:20 a 10:00.');
      const mono=buf.numberOfChannels<2,L=buf.getChannelData(0).slice(),R=mono?null:buf.getChannelData(1).slice();
      const sr=buf.sampleRate;
      const feat=await runDsp(L,R,sr,mono,(p,m)=>{it.p=p;it.msg=m;drawJob()});
      S.songs[it.i].feat[it.ab]=feat;it.state='ok';it.p=1;save();
    }catch(e){
      it.state='err';it.msg=(e&&e.message==='cancelado')?'Cancelado':((e&&e.message)||'No se pudo decodificar: archivo dañado o no es MP3.');
      if(e&&e.message==='cancelado')break;
    }
    drawJob();
  }
  ui.cancel=null;try{if(wl)wl.release()}catch(_){}
  const ok=items.filter(x=>x.state==='ok').length,bad=items.filter(x=>x.state==='err').length;
  const wasCancel=ui.job.cancel;ui.job=null;drawJob();save();
  if(ok){toast(`Análisis listo: ${ok} archivo${ok>1?'s':''}${bad?`, ${bad} con error`:''}.`);location.hash='#/resultados';render()}
  else{toast(wasCancel?'Análisis cancelado.':'No se pudo analizar ningún archivo. Revisa los mensajes.','err');render(true)}
}

/* ═══════════════ REPRODUCTOR Y FIRMA SÓNICA ═══════════════ */
const aud=new Audio();aud.preload='auto';const cur={i:-1,ab:'',url:null};
async function loadAud(i,ab){
  if(cur.i===i&&cur.ab===ab)return true;
  const b=await getBlob(i,ab);if(!b){toast('El audio no está disponible en este dispositivo. Vuelve a cargarlo.','err');return false}
  const same=cur.i===i,was=same&&!aud.paused,pos=same?aud.currentTime:0;
  if(cur.url)URL.revokeObjectURL(cur.url);
  cur.url=URL.createObjectURL(b);aud.src=cur.url;cur.i=i;cur.ab=ab;
  await new Promise(r=>{aud.onloadedmetadata=r;aud.onerror=r});
  try{aud.currentTime=pos}catch(_){}
  if(was)aud.play().catch(()=>{});
  return true;
}
const C1=[79,166,184],C2=[201,162,39],C3=[199,105,154];
const mixc=(a,b,t)=>a.map((v,k)=>Math.round(v+(b[k]-v)*t));
const sigColor=c=>{const k=c<.5?mixc(C1,C2,c*2):mixc(C2,C3,(c-.5)*2);return `rgb(${k[0]},${k[1]},${k[2]})`};
function drawSig(cv,f,ph,sz){
  const dpr=sz?1:(devicePixelRatio||1),w=sz?sz[0]:cv.clientWidth,h=sz?sz[1]:cv.clientHeight;if(!w||!h)return;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  x.fillStyle=sz?'#fff':'#111317';x.fillRect(0,0,w,h);
  const n=f.env.length,bw=w/n,mid=(h+12)/2;
  const cs=f.cent.map((_,k)=>{let s=0,c=0;for(let q=-3;q<=3;q++){const z=f.cent[k+q];if(z!=null){s+=z;c++}}return s/c});
  for(let k=0;k<n;k++){const bh=Math.max(2,f.env[k]*(h-20));x.fillStyle=sigColor(cs[k]);x.fillRect(k*bw+.4,mid-bh/2,Math.max(1,bw-.8),bh)}
  x.font='10px system-ui,sans-serif';x.textBaseline='top';
  (f.structure.sections||[]).forEach(s=>{const px=s.s/f.dur*w;
    if(s.s>0){x.fillStyle=sz?'#888':'rgba(237,230,211,.35)';x.fillRect(px,0,1,h)}
    if((s.e-s.s)/f.dur*w>34){x.fillStyle=sz?'#333':'rgba(237,230,211,.8)';x.fillText(s.label,px+3,2)}});
  if(ph!=null&&isFinite(ph)){x.fillStyle=sz?'#000':'#EDE6D3';x.fillRect(ph*w-1,0,2,h)}
}
let lastDraw=0,raf=0;
function updPlayer(force){
  const pb=$('#playbtn');if(pb)pb.textContent=(aud.paused?'Reproducir ':'Pausar ')+(ui.ab||'');
  const ck=$('#clock');if(ck)ck.textContent=fmtT(aud.currentTime||0);
  const now=performance.now();if(!force&&now-lastDraw<60)return;lastDraw=now;
  $$('canvas.sig').forEach(cv=>{const i=+cv.dataset.i,ab=cv.dataset.ab,f=S.songs[i]&&S.songs[i].feat[ab];if(f)drawSig(cv,f,(cur.i===i&&cur.ab===ab)?aud.currentTime/f.dur:null)});
}
function loop(){updPlayer();if(!aud.paused)raf=requestAnimationFrame(loop)}
aud.onplay=()=>{cancelAnimationFrame(raf);loop()};aud.onpause=()=>updPlayer(true);aud.onended=()=>updPlayer(true);

/* ═══════════════ EXPORTAR / IMPORTAR ═══════════════ */
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
function exportCSV(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"',rows=allRows();
  const hd=['Canción','Archivo','Versión','Ganadora','Veredicto','Hit comercial','Comercial','Unicornio sónico','Puntaje comercial','Puntaje unicornio',...DIMS.map(d=>d.n),'LUFS','BPM','Tonalidad','Duración (s)','Empresas mín MXN','Empresas máx MXN','Personas mín MXN','Personas máx MXN','Bandas mín MXN','Bandas máx MXN'];
  const ln=rows.map(r=>[q(r.title),q(r.file),r.ab,r.win?'sí':'no',q(r.ev.v.label),r.ev.v.hit?'sí':'no',r.ev.v.com?'sí':'no',r.ev.v.uni?'sí':'no',r.ev.comm,r.ev.uni,...DIMS.map(d=>r.ev.dims[d.k].s==null?'':r.ev.dims[d.k].s),r.ev.f.lufs,Math.round(r.ev.f.tempo.bpm),q(r.ev.f.key.name),r.ev.f.dur,r.val.empresas.min,r.val.empresas.max,r.val.personas.min,r.val.personas.max,r.val.bandas.min,r.val.bandas.max].join(','));
  dl('analisis_suno.csv','\ufeff'+[hd.map(q).join(','),...ln].join('\n'),'text/csv;charset=utf-8');
}
function exportJSON(){
  dl('analisis_suno.json',JSON.stringify({app:'analisis-suno',version:VERSION,exportado:new Date().toISOString(),precios:P,criterios:S.settings.thr,canciones:S.songs.map(s=>({title:s.title,genre:s.genre,lang:s.lang,prompt:s.prompt,aud:s.aud,instrumental:s.instrumental,files:s.files,manual:s.manual,feat:s.feat}))},null,1),'application/json');
}
async function importJSON(file){
  try{
    const j=JSON.parse(await file.text());
    if(j.app!=='analisis-suno'||!Array.isArray(j.canciones))throw new Error('Este archivo no es una exportación de Análisis Suno.');
    const st=loadState();st.songs=Array.from({length:NS},(_,i)=>blank(i));
    j.canciones.slice(0,NS).forEach((c,i)=>{const s=st.songs[i];
      s.title=String(c.title||'').slice(0,80);s.genre=GEN[c.genre]!==undefined?c.genre:'';s.lang=LANGS.includes(c.lang)?c.lang:'Español';
      s.prompt=String(c.prompt||'').slice(0,1500);s.aud=(c.aud||[]).filter(k=>AUD.some(a=>a.k===k));s.instrumental=!!c.instrumental;
      ['A','B'].forEach(ab=>{const f=c.feat&&c.feat[ab];
        if(f&&f.v===1&&f.structure&&Array.isArray(f.structure.sections)&&Array.isArray(f.env)&&f.tempo&&f.key&&f.centroid&&f.bestClip){
          s.feat[ab]=f;const fl=c.files&&c.files[ab];s.files[ab]=fl?{name:String(fl.name||''),size:+fl.size||0,hash:String(fl.hash||''),dur:+fl.dur||f.dur}:{name:'(importado)',size:0,hash:'',dur:f.dur};
          const m=c.manual&&c.manual[ab];if(m)s.manual[ab]={voz:Number.isFinite(m.voz)?cl(m.voz):null,id:Number.isFinite(m.id)?cl(m.id):null}}});});
    if(j.criterios)st.settings.thr=Object.assign(clone(THR0),{hit:+j.criterios.hit||78,com:+j.criterios.com||62,uni:+j.criterios.uni||68});
    st.songs.forEach((s,i)=>['A','B'].forEach(ab=>{if(s.feat[ab])evaluate(s.feat[ab],s,ab,new Map())}));
    S=st;if(j.precios&&j.precios.t)P=j.precios;save();savePrices();render();toast('Resultados importados. Los audios no se importan: vuelve a cargarlos si quieres escucharlos.');
  }catch(e){toast('No se pudo importar: '+(e.message||'archivo inválido'),'err')}
}
function buildPrint(){
  const rows=allRows(),ids=[...new Set(rows.map(r=>r.i))],d=new Date().toLocaleDateString('es-MX',{dateStyle:'long'});
  let h=`<h1>Análisis de canciones Suno AI</h1><p>Informe generado el ${d} · Análisis Suno v${VERSION}</p><h2>Veredicto por archivo</h2>
  <table><tr><th>Canción</th><th>Archivo</th><th>Ver.</th><th>Veredicto</th><th>Hit</th><th>Comercial</th><th>Unicornio</th><th>Com.</th><th>Uni.</th></tr>`+
  rows.map(r=>`<tr><td>${esc(r.title)}${r.win?' ★':''}</td><td>${esc(r.file)}</td><td>${r.ab}</td><td>${esc(r.ev.v.label)}</td><td>${r.ev.v.hit?'Sí':'No'}</td><td>${r.ev.v.com?'Sí':'No'}</td><td>${r.ev.v.uni?'Sí':'No'}</td><td>${r.ev.comm}</td><td>${r.ev.uni}</td></tr>`).join('')+`</table><p>★ = versión ganadora de su par.</p>`;
  ids.forEach(i=>{
    const pi=pairInfo(i),s=S.songs[i];
    h+=`<div class="pbreak"></div><h2>${esc(s.title||'Canción '+(i+1))}</h2><p>${[s.genre,s.lang,s.instrumental?'instrumental':''].filter(Boolean).map(esc).join(' · ')}${s.aud.length?' · Público: '+s.aud.map(k=>esc(AUD.find(a=>a.k===k).n)).join(', '):''}</p><ul>${pi.lines.map(l=>`<li>${l}</li>`).join('')}</ul>`;
    ['A','B'].forEach(ab=>{const e=pi.ev[ab];if(!e)return;
      const cv=document.createElement('canvas');drawSig(cv,e.f,null,[700,90]);
      h+=`<div class="pk"><h3>Versión ${ab}: ${esc(e.v.label)} <small>(${esc((s.files[ab]||{}).name||'')})</small></h3><img alt="Firma sónica ${ab}" src="${cv.toDataURL('image/png')}">
      <table><tr>${DIMS.map(x=>`<th>${x.n.split(' ')[0]}</th>`).join('')}<th>Com.</th><th>Uni.</th></tr><tr>${DIMS.map(x=>`<td>${e.dims[x.k].s==null?'—':e.dims[x.k].s}</td>`).join('')}<td>${e.comm}</td><td>${e.uni}</td></tr></table>
      <p><small>${Math.round(e.f.tempo.bpm)} BPM · ${esc(e.f.key.name)} · ${e.f.lufs.toFixed(1)} LUFS · ${fmtT(e.f.dur)}</small></p>
      <ul>${[...e.tips].sort((a,b)=>b.sev-a.sev).slice(0,4).map(t=>`<li>${esc(t.text)}</li>`).join('')}</ul>
      <table><tr><th>Comprador</th><th>Licencia</th><th>Rango MXN</th></tr>${Object.keys(SEG).map(g=>{const v=valuate(e,s)[g];return `<tr><td>${SEG[g]}</td><td>${v.lic}</td><td>${mxn(v.min)} – ${mxn(v.max)} MXN</td></tr>`}).join('')}</table></div>`});
  });
  h+=`<div class="pbreak"></div><h2>Tabla de precios usada (MXN) · revisión: ${esc(P.d)}</h2><table><tr><th>Comprador</th><th>Licencia</th><th>Mínimo</th><th>Máximo</th></tr>${Object.keys(SEG).map(g=>Object.keys(P.t[g]).map(l=>`<tr><td>${SEG[g]}</td><td>${l}</td><td>${mxn(P.t[g][l][0])}</td><td>${mxn(P.t[g][l][1])}</td></tr>`).join('')).join('')}</table>
  <p><b>Importante.</b> El análisis es una evaluación técnica y orientativa, no una garantía de éxito comercial. Los precios son estimaciones sujetas a cambios del mercado. La protección legal y la titularidad dependen de los términos de Suno AI y de las leyes de propiedad intelectual de cada país.</p>`;
  return h;
}

/* ═══════════════ RENDER Y EVENTOS ═══════════════ */
let lastRoute='';
function render(keep){
  const{r,a}=R_(),y=scrollY;
  $$('.tabs a').forEach(x=>x.setAttribute('aria-current',x.dataset.t===(r==='ficha'?'resultados':r)?'page':'false'));
  if(r!=='ficha'&&!aud.paused)aud.pause();
  const fn={cargar:vCargar,resultados:vResultados,ficha:()=>vFicha(+a),comparar:vComparar,precios:vPrecios,resumen:vResumen}[r]||vCargar;
  try{$('#view').innerHTML=fn()}catch(e){console.error(e);$('#view').innerHTML=`<div class="empty"><h2>Algo salió mal al mostrar esta pantalla</h2><p>${esc(e.message)}</p><a class="btn primary" href="#/cargar">Volver a Cargar</a></div>`}
  scrollTo(0,(keep&&lastRoute===r+(a||''))?y:0);lastRoute=r+(a||'');
  if(r==='ficha')requestAnimationFrame(()=>updPlayer(true));
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,A=(t.dataset.a||'').split('|'),{r,a}=R_();
  switch(act){
    case'analyze':analyzeAll();break;
    case'cancel':if(ui.job){if(ui.job.fin||!ui.job.items.some(x=>x.state==='run'||x.state==='wait')){ui.job=null;drawJob()}else{ui.job.cancel=true;if(ui.cancel)ui.cancel()}}break;
    case'rm':{const i=+A[0],ab=A[1];S.songs[i].files[ab]=null;S.songs[i].feat[ab]=null;S.songs[i].manual[ab]={voz:null,id:null};ui.msg[i+ab]=null;mem.delete(i+ab);await idb.del(i+ab);save();render(true);break}
    case'wipe-audio':if(confirm('¿Quitar todos los archivos y resultados de las 5 canciones?')){S.songs=Array.from({length:NS},(_,i)=>blank(i));mem.clear();ui.msg={};await idb.clear();save();render(true)}break;
    case'wipe-results':if(confirm('¿Borrar todos los resultados? Los audios se conservan para volver a analizarlos.')){S.songs.forEach(s=>{s.feat={A:null,B:null};s.manual={A:{voz:null,id:null},B:{voz:null,id:null}}});save();render(true)}break;
    case'wipe-all':if(confirm('¿Borrar TODO (audios, resultados, precios y criterios) de este dispositivo?')){S=loadState();S.songs=Array.from({length:NS},(_,i)=>blank(i));S.settings={mode:'eq',thr:clone(THR0)};P={d:'valores iniciales sin revisar',t:clone(P0),ok:false};mem.clear();ui.msg={};await idb.clear();localStorage.removeItem('sua_v2');localStorage.removeItem('sua_price');render(true);toast('Datos borrados.')}break;
    case'mode':S.settings.mode=t.dataset.v;save();render(true);break;
    case'ab':{ui.ab=t.dataset.v;if(cur.i===+a&&!aud.paused)await loadAud(+a,ui.ab);render(true);break}
    case'play':{const i=+a;if(!await loadAud(i,ui.ab))break;if(aud.paused)aud.play().catch(()=>{});else aud.pause();updPlayer(true);break}
    case'man-on':{const[i,ab,k]=A;S.songs[+i].manual[ab][k]=60;save();render(true);break}
    case'man-off':{const[i,ab,k]=A;S.songs[+i].manual[ab][k]=null;save();render(true);break}
    case'save-prices':{$$('[data-p]').forEach(inp=>{const[g,l,k]=inp.dataset.p.split('|');P.t[g][l][k]=Math.max(0,+inp.value||0)});
      for(const g in P.t)for(const l in P.t[g])if(P.t[g][l][0]>P.t[g][l][1])P.t[g][l].reverse();
      P.iso=new Date().toISOString();P.d=new Date().toLocaleDateString('es-MX',{dateStyle:'long'});P.ok=true;savePrices();render(true);toast('Precios guardados. Revisión actualizada a hoy.');break}
    case'reset-prices':if(confirm('¿Restablecer los precios iniciales?')){P={d:'valores iniciales sin revisar',t:clone(P0),ok:false};savePrices();render(true)}break;
    case'thr-reset':S.settings.thr=clone(THR0);save();render(true);break;
    case'print':{const root=$('#print-root');root.innerHTML=rowsOk()?buildPrint():'<p>No hay resultados para exportar.</p>';setTimeout(()=>print(),200);break}
    case'csv':if(rowsOk())exportCSV();else toast('No hay resultados para exportar.','err');break;
    case'json':exportJSON();break;
    case'install':if(ui.deferred){ui.deferred.prompt();await ui.deferred.userChoice.catch(()=>{});ui.deferred=null;render(true)}break;
    case'reload':location.reload();break;
  }
});
const rowsOk=()=>S.songs.some(s=>s.feat.A||s.feat.B);
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.file){const[i,ab]=t.dataset.file.split('|'),f=t.files[0];t.value='';if(f)await addFile(+i,ab,f);return}
  if(t.id==='bulk'){const fs=[...t.files];t.value='';if(fs.length)await bulkAdd(fs);return}
  if(t.id==='imp'){const f=t.files[0];t.value='';if(f)await importJSON(f);return}
  if(t.dataset.aud){const[i,k]=t.dataset.aud.split('|'),s=S.songs[+i];s.aud=t.checked?[...new Set([...s.aud,k])]:s.aud.filter(x=>x!==k);save();return}
  if(t.dataset.man){const[i,ab,k]=t.dataset.man.split('|');S.songs[+i].manual[ab][k]=+t.value;save();render(true);return}
  if(t.dataset.thr){const k=t.dataset.thr,T=S.settings.thr;T[k]=cl(Math.round(+t.value||THR0[k]),30,99);if(T.hit<T.com)T.hit=T.com;save();render(true);return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f){const[i,k]=t.dataset.f.split('|'),s=S.songs[+i];s[k]=t.type==='checkbox'?t.checked:t.value;save();
    if(k==='genre'&&rowsOk()){/* el género cambia la evaluación; se refleja al abrir resultados */}return}
  if(t.dataset.man){const k=t.dataset.man.split('|')[2],el=$('#mv-'+k);if(el)el.textContent=t.value}
});
document.addEventListener('click',e=>{const c=e.target.closest('canvas.sig');if(!c)return;
  const i=+c.dataset.i,ab=c.dataset.ab,f=S.songs[i].feat[ab],rc=c.getBoundingClientRect();

addEventListener('hashchange',()=>render());
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(R_().r==='ficha')updPlayer(true)},150)});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ui.deferred=e;if(R_().r==='resumen')render(true)});
addEventListener('appinstalled',()=>{ui.deferred=null});

/* ═══════════════ PWA ═══════════════ */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  const had=!!navigator.serviceWorker.controller;
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

}
idb.open().then(()=>{});
render();
window.__app={S:()=>S,evaluate,pairInfo,allRows,valuate,render};
})();
